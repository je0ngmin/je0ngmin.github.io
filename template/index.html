{% extends 'base.html' %}


{% block main %}
<h2 class="sr-only">글 목록</h1>
<ul id="article-list">
    {% for article in articles %}
    <li>
        <div id="number">{{ article.url }}</div>
        <div class="content">
            <a class="title" href="/{{ article.url }}">{{ article.title }}</a>
            <div class="description">{{ article.description }}</div>
        </div>
    </li>
    {% endfor %}
</ul>
{% endblock %}
